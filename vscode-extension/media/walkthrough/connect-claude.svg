<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Réponses de Claude Code capturées dans une inbox">
  <!-- chat bubble -->
  <rect x="50" y="50" width="140" height="90" rx="16" fill="#5A3D8A"/>
  <path d="M90 140 L90 165 L120 140 Z" fill="#5A3D8A"/>
  <rect x="70" y="76" width="100" height="8" rx="3" fill="#E3D6FF"/>
  <rect x="70" y="94" width="80" height="8" rx="3" fill="#E3D6FF"/>
  <rect x="70" y="112" width="60" height="8" rx="3" fill="#E3D6FF"/>

  <!-- arrow -->
  <path d="M195 100 L250 100" stroke="#AAB2C0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M238 88 L252 100 L238 112" stroke="#AAB2C0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- inbox tray -->
  <g transform="translate(260,60)">
    <path d="M0 40 L20 40 L32 60 L68 60 L80 40 L100 40 L100 96 L0 96 Z" fill="#2E6B57"/>
    <path d="M0 40 L26 0 L74 0 L100 40" fill="#0E6B57"/>
    <rect x="32" y="60" width="36" height="12" rx="4" fill="#BFF3E3"/>
  </g>
</svg>
