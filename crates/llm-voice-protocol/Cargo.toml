[package]
name = "llm-voice-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Types de messages du protocole Core v1 (ADR-012, GAO-protocole-co-001) : désérialisation serde et validation croisée avec les schémas JSON et exemples de contracts/core-v1, partagés avec le test vitest (ajv) côté extension."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
