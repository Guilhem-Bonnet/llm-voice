[package]
name = "llm-voice-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Démon Rust local (ADR-012) : serveur HTTP+WS sur 127.0.0.1, jeton de session, instance unique, aucune connexion sortante ; pilote llm-voice-audio."
publish = false

[[bin]]
name = "llm-voice-core"
path = "src/main.rs"

[dependencies]
llm-voice-protocol = { path = "../llm-voice-protocol" }
llm-voice-audio = { path = "../llm-voice-audio" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
rand = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
tempfile = "3"
hound = "3.5"
