name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode-extension

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Traceability matrix (docs/traceability.md vs actual test files)
        working-directory: .
        run: node scripts/check-traceability.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: unit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: vscode-extension/coverage/
          retention-days: 5
          if-no-files-found: ignore

  integration:
    name: integration
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: Run integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    name: package
    needs: [unit, integration, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run check:vsix
      - run: npm run check:licenses
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: llm-voice-vsix
          path: vscode-extension/*.vsix
          retention-days: 5
