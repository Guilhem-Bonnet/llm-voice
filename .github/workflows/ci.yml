name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vscode-extension

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Traceability matrix (docs/traceability.md vs actual test files)
        working-directory: .
        run: node scripts/check-traceability.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: unit
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: vscode-extension/coverage/
          retention-days: 5
          if-no-files-found: ignore

  integration:
    name: integration
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: Run integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

  package:
    name: package
    needs: [unit, integration, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run check:vsix
      - run: npm run check:licenses
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: llm-voice-vsix
          path: vscode-extension/*.vsix
          retention-days: 5

  package-linux-x64:
    name: package-linux-x64
    # S1 (ADR-012 §7, decisions-log 2026-09-28) : linux-x64 (Fedora/Wayland)
    # d'abord ; darwin en S3, win32 en S4 — un job équivalent par plateforme
    # rejoindra cette matrice à ces étapes.
    needs: [unit, integration, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/.nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install ALSA headers (cpal build dependency)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: npm ci
      - run: npm run package:linux-x64
      - run: npm run check:vsix:linux-x64
      - name: Smoke test (extract, run, /health, arrêt propre)
        working-directory: .
        run: bash scripts/smoke-core-vsix.sh vscode-extension/llm-voice-linux-x64.vsix linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: llm-voice-linux-x64-vsix
          path: vscode-extension/llm-voice-linux-x64.vsix
          retention-days: 5
