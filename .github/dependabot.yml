version: 2
updates:
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - Guilhem-Bonnet

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    commit-message:
      prefix: "chore(ci)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    reviewers:
      - Guilhem-Bonnet
