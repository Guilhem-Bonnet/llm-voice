$schema: "grimoire-llm-provider-registry/v1"

metadata:
  project: "TTS-Voice"
  owner: "guilhem-bonnet"
  policy: "No provider/model call outside this registry."
  # Routage réel du projet (décision 2026-09-08, mémoire « économiser Fable ») :
  #   Fable 5.1  = boucle principale (concierge) : triage, handoffs, gates — jamais le travail de fond
  #   Opus 5     = ADR, machines à états, audits sécurité pré-release
  #   Sonnet 5   = implémentation TypeScript, tests, revues, fix-loop
  #   Haiku 4.5  = CI/CD YAML, docs, CHANGELOG, mémoire
  #   Ollama     = narrateur de l'extension (qwen2.5:7b, localhost:11434) et embeddings mémoire Grimoire
  # Escalade : Haiku échoue 1× → Sonnet ; Sonnet échoue 2× même symptôme → Opus ; désaccord → Fable arbitre.

providers:
  - id: "anthropic"
    enabled: true
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "reasoning", "review"]
    default_models: ["claude-sonnet-5"]
    currency: "quota"
    invocation: "claude -p {prompt} --model {model}"
    models:
      - id: "claude-haiku-4-5-20251001"
        tier: "cheap"
      - id: "claude-sonnet-5"
        tier: "mid"
      - id: "claude-opus-5"
        tier: "strong"
      - id: "claude-fable-5-1"
        tier: "strong"
    data_policy:
      allowed_data_classes: ["code-du-projet", "cahier-des-charges", "fixtures-synthetiques", "documentation-publique"]
      forbidden_data_classes: ["secrets", "cles-api", "contenu-env", "documents-personnels-hors-repo", "audio-utilisateur"]
      retention_notes: "Abonnement Claude via Claude Code ; le projet ne journalise aucun prompt, seulement les métadonnées de dispatch (agent, modèle, coût)."
    fallback_order: ["local"]
    audit:
      log_prompts: false
      log_metadata: true

  - id: "local"
    enabled: true
    provider_type: "local"
    allowed_capabilities: ["chat", "code", "embeddings"]
    default_models: ["qwen2.5:7b"]
    currency: "local"
    invocation: "ollama run {model}"
    models:
      - id: "qwen2.5:7b"
        tier: "cheap"
    data_policy:
      allowed_data_classes: ["code-du-projet", "cahier-des-charges", "fixtures-synthetiques", "documentation-publique", "texte-lu-par-l-extension"]
      forbidden_data_classes: ["secrets", "cles-api", "contenu-env"]
      retention_notes: "Exécution locale (Ollama, localhost:11434) : le texte narré par l'extension ne quitte jamais la machine (invariant P0 local-first)."
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "github-copilot"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "review"]
    default_models: []
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: "Non utilisé pour le développement ; Copilot Chat reste un hôte possible pour les agents Grimoire, pas un fournisseur appelé par le projet."
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "openai"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "reasoning", "embeddings"]
    default_models: []
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: "Non utilisé."
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

  - id: "google-gemini"
    enabled: false
    provider_type: "hosted"
    allowed_capabilities: ["chat", "code", "multimodal", "reasoning"]
    default_models: []
    data_policy:
      allowed_data_classes: []
      forbidden_data_classes: []
      retention_notes: "Non utilisé."
    fallback_order: []
    audit:
      log_prompts: false
      log_metadata: true

routing:
  default_provider: "anthropic"
  default_fallback_chain: ["anthropic", "local"]
  require_capability_match: true
  require_data_policy_match: true
