# Nettoyages périodiques : TTL, doublons, obsolescence, données sensibles.
cleanup:
  - date: "2026-09-08"
    by: "concierge"
    action: "revue initiale du registre ; aucun artefact expiré"
    next_review: "2026-12-08"
