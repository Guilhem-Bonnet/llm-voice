$schema: "grimoire-agentic-standard-retention-registry/v1"
metadata:
  project: "LLM Voice"
  generated_by: "grimoire standard init"
  purpose: "Chaque artefact produit a une destination — durable, archive, TTL, désindexation ou purge — et chaque nettoyage ou purge laisse une trace."

# Inventaire : ce que le projet produit, et ce qu'il en advient.
# Les trois premières entrées sont ce que le kit lui-même écrit.
artifacts:
  - id: RET-001
    artifact: "_grimoire/standard/"
    type: charte
    status: active
    owner: ""
    sensitivity: interne
    indexable: true
    retention: durable
    expires_at: ""
    superseded_by: ""
  - id: RET-002
    artifact: "_grimoire-output/evidence/"
    type: preuve
    status: active
    owner: "guilhem-bonnet"
    sensitivity: interne
    indexable: false
    retention: projet
    expires_at: "2027-09-08"
    superseded_by: ""
  - id: RET-003
    artifact: "_grimoire-output/events/runtime-journal.jsonl"
    type: log
    status: active
    owner: ""
    sensitivity: interne
    indexable: false
    retention: "court terme"
    expires_at: "rotation à 10 000 événements"
    superseded_by: ""
