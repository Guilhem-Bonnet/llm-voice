    par mot (R4 fermé : aucun des modèles Kyutai n'en produit). getCapabilities() ne doit jamais annoncer de capacité non
    prouvée. Respecter EgressGuard (ADR-010) : localOnly par défaut, aucune requête hors 127.0.0.1 sans trustedHosts explicite.
    AbortSignal déjà avorté -> AbortError sans requête. health() -> 'unreachable' si le serveur ne répond pas, jamais de faux
    vert. Capturer une réponse réelle de 'pocket-tts serve' (README : https://github.com/kyutai-labs/pocket-tts) pour construire
    le fake de test, comme fait pour Ollama dans ADR-013. Catalogue de voix par défaut limité à CC0/CC-BY (ADR-016 §4) avec
    attribution ; voix CC-BY-NC exclues. Ne pas changer les défauts existants (Chatterbox reste provider principal)."
