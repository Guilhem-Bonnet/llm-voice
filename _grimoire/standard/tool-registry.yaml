$schema: "grimoire-agentic-standard-tool-registry/v1"
metadata:
  project: "TTS-Voice"
  generated_by: "grimoire standard init"
  purpose: "Tout outil est inscrit avec son risque et ses permissions ; toute intégration MCP est un contrat ; toute erreur d'outil devient une preuve ou un incident."

# Outils que les agents peuvent appeler. Les deux premiers existent sur tout hôte.
tools:
  - id: TOOL-001
    name: shell
    kind: shell               # shell | file | search | network | browser | mcp | model
    risk: élevé               # faible | moyen | élevé | critique
    permissions: [read, execute]   # read | write | execute | network | external
    owner: "guilhem-bonnet"
  - id: TOOL-002
    name: file-edit
    kind: file
    risk: moyen
    permissions: [read, write]
    owner: "guilhem-bonnet"
  - id: TOOL-003
    name: code-search
    kind: search
    risk: faible
    permissions: [read]
    owner: "guilhem-bonnet"
  - id: TOOL-004
    name: git-gh
    kind: network
    risk: élevé
    permissions: [read, write, network, external]
    owner: "guilhem-bonnet"
    # push, merge de PR et release GitHub demandent une approbation par session (policies.yaml)
  - id: TOOL-005
    name: npm-vitest-vsce
    kind: shell
    risk: moyen
    permissions: [read, write, execute, network]
    owner: "guilhem-bonnet"
    # build/tests/packaging de l'extension ; publication Marketplace hors périmètre (pas de VSCE_PAT)
  - id: TOOL-006
    name: claude-subagent
    kind: model
    risk: moyen
    permissions: [read, write, execute]
    owner: "guilhem-bonnet"
    # sous-agents Grimoire dispatchés avec `model:` explicite (registre llm-provider-registry.yaml)

# Serveurs MCP : owner, scopes minimaux, timeout, journalisation.
mcp_servers:
  - id: MCP-001
    server: "grimoire"
    owner: "guilhem-bonnet"
    scopes: [lecture-projet, memoire-projet, taches, standard, hotes]
    timeout_s: 30
    logging:
      requests: true
      errors: true
      secrets_masked: true
    environment: local
    risk: moyen
    human_validation: "écriture mémoire durable, changement de statut de tâche, ajout d'agent"
    out_of_scope: false
    out_of_scope_reason: ""
  - id: MCP-002
    server: "hostinger-agency-hosting"
    owner: "guilhem-bonnet"
    scopes: [aucun-hors-perimetre]   # aucun appel autorisé depuis ce projet
    timeout_s: 30
    logging:
      requests: true
      errors: true
      secrets_masked: true
    environment: externe
    risk: élevé
    human_validation: "toujours"
    out_of_scope: true
    out_of_scope_reason: "Serveur MCP du compte utilisateur (~/.claude.json), sans rapport avec LLM Voice : jamais appelé depuis ce projet, aucune donnée du projet ne lui est envoyée."
