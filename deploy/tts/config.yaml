# Seed config for Chatterbox-TTS-Server (devnen/Chatterbox-TTS-Server).
# Copied once to ~/.llm-voice/models/chatterbox/config.yaml (deploy/README.md
# "Premier lancement") — the running copy is then owned by the container
# (Web UI / `/save_settings` writes back to it), this file in git is only the
# starting point.
server:
  host: 0.0.0.0
  port: 8004
  use_ngrok: false
  use_auth: false
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
model:
  # Chatterbox Multilingual V3 (CdC: TTS principal, 23 langues dont FR).
  repo_id: chatterbox-multilingual
tts_engine:
  # Overridden by TTS_ENGINE_DEVICE (compose env, ADR-009 CPU fallback).
  device: auto
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: Emily.wav
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.8
  exaggeration: 1.3
  cfg_weight: 0.5
  seed: 0
  speed_factor: 1.0
  language: fr
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
ui:
  title: Chatterbox TTS Server (LLM Voice)
  show_language_select: true
  max_predefined_voices_in_dropdown: 50
debug:
  save_intermediate_audio: false
